<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@400;500&display=swap">
<title>Cartoes McMinsky: folhas A4</title>
<!--
  Base: o "legacy a4 grid generator.html" do Andre, que ele enviou a 16 Out 2026 e que ja fazia o
  essencial. O que ficou dele, sem mexer: a folha em 210 por 297 mm, as faixas de margem em mm, a
  grelha em linhas por colunas, as definicoes guardadas no localStorage, o botao de repor, e as
  regras de impressao que fazem o PDF sair SEM GRELHA (faixas transparentes e sem bordas nas
  celulas). Nao e biblioteca de PDF: e o print do proprio browser, e e por isso que a Cormorant
  Garamond do site funciona sem embutir nada.

  O que mudou: onde ele carregava UMA imagem que se repetia em todas as celulas, agora cada etiqueta
  leva o seu proprio conteudo gerado, porque cada etiqueta tem um numero de afiliado diferente. Os
  numeros nao sao escolhidos aqui: sao RESERVADOS pelo servidor, senao duas folhas impressas em dias
  diferentes repetiam numeros e o papel nao se corrige.
-->
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background-color: #555;
    font-family: system-ui, -apple-system, sans-serif;
    display: flex; flex-direction: column; align-items: center; padding: 30px;
  }
  .controls {
    background: white; padding: 20px 30px; border-radius: 8px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.3); margin-bottom: 30px;
    width: 100%; max-width: 520px; display: flex; flex-direction: column; gap: 12px;
    text-align: center;
  }
  .controls h3 { font-weight: 600; }
  .input-group {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px; background: #f8f9fa; border-radius: 6px; gap: 10px;
  }
  .input-group label { text-align: left; }
  input[type="number"], select { width: 110px; padding: 5px; font-size: 16px; text-align: center; }
  button {
    background-color: #007bff; color: white; border: none; padding: 12px;
    font-size: 16px; border-radius: 6px; cursor: pointer; transition: background 0.2s;
  }
  button:hover { background-color: #0056b3; }
  button.secondary { background-color: #6c757d; }
  button.secondary:hover { background-color: #545b62; }
  button:disabled { background-color: #b0b0b0; cursor: not-allowed; }
  .aviso { font-size: 13px; line-height: 1.5; text-align: left; padding: 10px; border-radius: 6px; }
  .aviso.erro { background: #fdecea; color: #b3261e; }
  .aviso.ok { background: #e7f5ec; color: #1b5e34; }

  /* --- A FOLHA A4 --- */
  .sheet {
    background: white; width: 210mm; height: 297mm;
    display: flex; flex-direction: column;
    box-shadow: 0 0 20px rgba(0,0,0,0.5); position: relative; overflow: hidden;
  }
  .margin-stripe {
    width: 100%; background-color: #ffebee; display: flex; justify-content: center;
    align-items: center; font-size: 10px; color: #d32f2f; font-weight: bold;
    text-transform: uppercase; letter-spacing: 2px; flex-shrink: 0;
    border-bottom: 1px dashed #ccc;
  }
  .margin-stripe.bottom { border-bottom: none; border-top: 1px dashed #ccc; }
  .grid-area { width: 100%; flex-grow: 1; min-height: 0; display: grid; }
  /* Duas metades iguais. Ele corta a etiqueta ao meio na guilhotina, logo cada metade tem de ser
     um cartao inteiro e centrado nela propria. Isto substitui a regra antiga de espacamento igual
     nos tres intervalos, que so fazia sentido quando a etiqueta era UM cartao. */
  .cell {
    border: 0.5px solid #f0f0f0; display: flex; align-items: stretch;
    overflow: hidden; padding: 0.6mm;
  }
  .meia {
    flex: 1 1 50%; min-width: 0; display: flex; align-items: center; justify-content: center;
    padding: 0.4mm;
  }
  .cell svg { max-width: 100%; max-height: 100%; width: auto; height: auto; }
  .cell.vazia { background: #fafafa; }

  /* --- IMPRESSAO (PDF) --- */
  @media print {
    @page { size: A4; margin: 0; }
    body { background: none; padding: 0; }
    .controls { display: none; }
    .sheet { box-shadow: none; height: 297mm; }
    .margin-stripe { background-color: transparent; color: transparent; border: none; }
    .cell { border: none; }
    .cell.vazia { background: none; }
  }
</style>
</head>
<body>
  <div class="controls">
    <h3>Folhas de cartões</h3>

    <div class="input-group">
      <label for="donoInput"><strong>Dono do cartão</strong></label>
      <select id="donoInput"></select>
    </div>
    <div class="input-group">
      <label for="topMarginInput"><strong>Margem Superior (mm)</strong></label>
      <input type="number" id="topMarginInput" value="10" min="0" max="150" step="0.5">
    </div>
    <div class="input-group">
      <label for="bottomMarginInput"><strong>Margem Inferior (mm)</strong></label>
      <input type="number" id="bottomMarginInput" value="10" min="0" max="150" step="0.5">
    </div>
    <div class="input-group">
      <label for="rowsInput"><strong>Número de linhas</strong></label>
      <input type="number" id="rowsInput" value="11" min="1" max="50">
    </div>
    <div class="input-group">
      <label for="colsInput"><strong>Número de colunas</strong></label>
      <input type="number" id="colsInput" value="3" min="1" max="20">
    </div>
    <div class="input-group">
      <label for="quantosInput"><strong>Quantos cartões</strong></label>
      <input type="number" id="quantosInput" value="66" min="1" max="400">
    </div>

    <button id="reservarBtn" type="button">Reservar números e gerar</button>
    <button onclick="window.print()">Guardar como PDF</button>
    <button class="secondary" type="button" id="resetBtn">Repor predefinições</button>
    <div class="aviso" id="aviso" style="display:none"></div>
  </div>

  <div class="sheet">
    <div class="margin-stripe top" id="topStripe">MARGEM SUPERIOR</div>
    <div class="grid-area" id="gridContainer"></div>
    <div class="margin-stripe bottom" id="bottomStripe">MARGEM INFERIOR</div>
  </div>

<script src="/painel/qrcode-generator.js"></script>
<script>
(function () {
  'use strict';

  const gridContainer = document.getElementById('gridContainer');
  const topStripe = document.getElementById('topStripe');
  const bottomStripe = document.getElementById('bottomStripe');
  const topMarginInput = document.getElementById('topMarginInput');
  const bottomMarginInput = document.getElementById('bottomMarginInput');
  const rowsInput = document.getElementById('rowsInput');
  const colsInput = document.getElementById('colsInput');
  const quantosInput = document.getElementById('quantosInput');
  const donoInput = document.getElementById('donoInput');
  const reservarBtn = document.getElementById('reservarBtn');
  const resetBtn = document.getElementById('resetBtn');
  const aviso = document.getElementById('aviso');

  const DEFAULTS = { topMargin: 10, bottomMargin: 10, rows: 11, cols: 3, quantos: 66, dono: 1 };
  const STORAGE_KEY = 'a4GridSettings';

  // Os cartoes reservados na ultima vez. Ficam guardados para a folha sobreviver a um refresh
  // acidental: numeros reservados nao se podem perder, porque ja estao gastos do lado do servidor.
  const CARTOES_KEY = 'cartoesUltimoLote';
  let cartoes = [];

  function mostrar(texto, tipo) {
    aviso.textContent = texto;
    aviso.className = 'aviso ' + (tipo || '');
    aviso.style.display = texto ? 'block' : 'none';
  }

  function loadSettings() {
    let saved = {};
    try { saved = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; } catch (e) { saved = {}; }
    const s = Object.assign({}, DEFAULTS, saved);
    topMarginInput.value = s.topMargin;
    bottomMarginInput.value = s.bottomMargin;
    rowsInput.value = s.rows;
    colsInput.value = s.cols;
    quantosInput.value = s.quantos;
    return s;
  }

  function saveSettings() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      topMargin: parseFloat(topMarginInput.value) || 0,
      bottomMargin: parseFloat(bottomMarginInput.value) || 0,
      rows: parseInt(rowsInput.value, 10) || 1,
      cols: parseInt(colsInput.value, 10) || 1,
      quantos: parseInt(quantosInput.value, 10) || 1,
      dono: parseInt(donoInput.value, 10) || 1,
    }));
  }

  // Um conjunto e UM cartao: o QR a esquerda e, ao lado, "McMinsky.pt" por cima de "P=1 | A=22".
  //
  // As duas linhas ficam com a MESMA largura, e isso faz-se a mexer no espaco entre as letras, que
  // foi o que ele pediu: "teria de se mexer é no espaçamento lateral entre as letras em si. nunca
  // esticar, fica cheesy e nada profissional". Esticar glifos (textLength com spacingAndGlyphs)
  // deforma a letra e vê-se. A largura natural de cada linha mede-se numa tela, com a MESMA fonte,
  // e so depois se calcula quanto espaco falta repartir entre as letras.
  //
  // O endereco vai todo em MAIUSCULAS de proposito: o QR tem um modo de codificacao proprio, mais
  // denso, so para maiusculas, digitos e . / : - + * % $, e isso da um codigo mais pequeno e com
  // mais correccao de erro ao mesmo tempo (medido a 16 Out 2026: 25 modulos em maiusculas contra 29
  // em minusculas, e 33 na forma com parametros de consulta, que cai sempre no modo de bytes).

  // A marca vai na letra da casa. O NUMERO vai em Inter, porque os algarismos do Cormorant sao
  // antigos e o 1 sai igual a um i maiusculo: num numero que se le a olho para identificar o
  // cartao, isso nao serve.
  const FONTE_MARCA = '"Cormorant Garamond", Garamond, "Times New Roman", serif';
  const FONTE_NUMERO = 'Inter, "Helvetica Neue", Arial, sans-serif';
  let telaMedida = null;
  function largura(texto, tamanho, fonte) {
    if (!telaMedida) telaMedida = document.createElement('canvas').getContext('2d');
    telaMedida.font = '500 ' + tamanho + 'px ' + fonte;
    return telaMedida.measureText(texto).width;
  }

  function escapar(t) {
    return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function conjunto(cartao) {
    const qr = qrcode(0, 'Q');
    qr.addData(cartao.url_qr, 'Alphanumeric');
    qr.make();
    const n = qr.getModuleCount();

    const LADO = 100;                 // unidades do desenho, nao mm: o SVG escala com a celula
    const GAP = 9;
    const LARGURA_TEXTO = 68;
    const total = LADO + GAP + LARGURA_TEXTO;
    const modulo = LADO / n;

    let modulos = '';
    for (let r = 0; r < n; r++) {
      for (let c = 0; c < n; c++) {
        if (qr.isDark(r, c)) {
          modulos += '<rect x="' + (c * modulo).toFixed(3) + '" y="' + (r * modulo).toFixed(3)
            + '" width="' + modulo.toFixed(3) + '" height="' + modulo.toFixed(3) + '"/>';
        }
      }
    }

    const linhas = [
      { texto: 'McMinsky.pt', fonte: FONTE_MARCA, peso: 500, y: 45, altura: 24 },
      { texto: 'P=' + cartao.dono + '  |  A=' + cartao.afiliado, fonte: FONTE_NUMERO, peso: 500, y: 70, altura: 19 },
    ];

    // Cada linha tem o seu tamanho de letra, e o espaco ENTRE as letras e que a leva exactamente a
    // largura do bloco de texto. O espaco entra depois de cada letra, logo sao (n-1) intervalos a
    // repartir, que e o que faz a tinta acabar no sitio certo.
    const desenhadas = linhas.map(function (l) {
      // A altura pedida e um TECTO, nao uma imposicao: se a linha natural ja for mais larga do que
      // o bloco, encolhe-se a letra ate caber com folga. Sem isto o espacamento sai negativo e as
      // letras sobrepoem-se, que foi o que aconteceu na primeira tentativa.
      const naturalUnitaria = largura(l.texto, 100, l.fonte) / 100;
      const tamanho = Math.min(l.altura, (LARGURA_TEXTO * 0.92) / naturalUnitaria);
      const natural = naturalUnitaria * tamanho;
      const intervalos = Math.max(1, l.texto.length - 1);
      const espaco = (LARGURA_TEXTO - natural) / intervalos;
      return '<text x="' + (LADO + GAP).toFixed(2) + '" y="' + l.y + '"'
        + ' font-family=\'' + l.fonte + '\' font-weight="' + l.peso + '"'
        + ' font-size="' + tamanho.toFixed(3) + '" letter-spacing="' + espaco.toFixed(4) + '"'
        + ' fill="#000">' + escapar(l.texto) + '</text>';
    });

    return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + total + ' ' + LADO + '"'
      + ' shape-rendering="crispEdges">'
      + '<g fill="#000">' + modulos + '</g>'
      + '<g shape-rendering="auto">' + desenhadas.join('') + '</g>'
      + '</svg>';
  }

  function metade(cartao) {
    const div = document.createElement('div');
    div.className = 'meia';
    if (cartao) div.innerHTML = conjunto(cartao);
    return div;
  }

  function initGrid() {
    const rows = Math.max(1, parseInt(rowsInput.value, 10) || 1);
    const cols = Math.max(1, parseInt(colsInput.value, 10) || 1);
    const total = rows * cols;

    gridContainer.style.gridTemplateColumns = 'repeat(' + cols + ', 1fr)';
    gridContainer.style.gridTemplateRows = 'repeat(' + rows + ', 1fr)';
    gridContainer.innerHTML = '';

    // DOIS cartoes por etiqueta, com numeros DIFERENTES, porque ele corta a etiqueta ao meio:
    // "cada etiqueta tem dois qr codes! é para ser para dois afiliados diferentes e nao repetido!
    // isto depois quando imprime eu vou cortar na guilhotina!". Logo uma folha de 33 etiquetas da
    // 66 cartoes.
    for (let i = 0; i < total; i++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      const esquerdo = cartoes[i * 2];
      const direito = cartoes[i * 2 + 1];
      if (esquerdo || direito) {
        cell.appendChild(metade(esquerdo));
        cell.appendChild(metade(direito));
      } else {
        cell.classList.add('vazia');
      }
      gridContainer.appendChild(cell);
    }
  }

  function updateMargins() {
    let topMm = parseFloat(topMarginInput.value);
    let bottomMm = parseFloat(bottomMarginInput.value);
    if (isNaN(topMm) || topMm < 0) topMm = 0;
    if (isNaN(bottomMm) || bottomMm < 0) bottomMm = 0;
    const A4 = 297, MIN_GRID = 20;
    if (topMm + bottomMm > A4 - MIN_GRID) {
      const escala = (A4 - MIN_GRID) / (topMm + bottomMm);
      topMm *= escala; bottomMm *= escala;
    }
    topStripe.style.height = topMm + 'mm';
    bottomStripe.style.height = bottomMm + 'mm';
  }

  function applyAll() {
    updateMargins();
    initGrid();
    saveSettings();
  }

  async function carregarDonos() {
    try {
      const r = await fetch('/api/donos', { credentials: 'same-origin' });
      if (!r.ok) throw new Error('estado ' + r.status);
      const dados = await r.json();
      donoInput.innerHTML = '';
      for (const d of dados.donos) {
        const o = document.createElement('option');
        o.value = d.num;
        o.textContent = d.num + ' - ' + d.nome;
        donoInput.appendChild(o);
      }
      let saved = {};
      try { saved = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; } catch (e) {}
      if (saved.dono) donoInput.value = saved.dono;
    } catch (e) {
      mostrar('Não consegui ler os donos de cartão: ' + e.message, 'erro');
    }
  }

  async function reservar() {
    const quantos = parseInt(quantosInput.value, 10) || 0;
    const dono = parseInt(donoInput.value, 10) || 0;
    if (!dono || quantos < 1) { mostrar('Falta o dono ou a quantidade.', 'erro'); return; }

    // Cada etiqueta leva DOIS cartoes, logo cabem o dobro.
    const cabem = (parseInt(rowsInput.value, 10) || 1) * (parseInt(colsInput.value, 10) || 1) * 2;
    if (quantos > cabem) {
      mostrar('Pediu ' + quantos + ' cartões mas a folha só tem ' + cabem + ' etiquetas.', 'erro');
      return;
    }

    reservarBtn.disabled = true;
    mostrar('A reservar números...', '');
    try {
      const r = await fetch('/api/lotes', {
        method: 'POST',
        credentials: 'same-origin',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ dono: dono, quantos: quantos }),
      });
      const dados = await r.json();
      if (!r.ok || !dados.ok) throw new Error(dados.erro || ('estado ' + r.status));
      cartoes = dados.cartoes;
      localStorage.setItem(CARTOES_KEY, JSON.stringify(cartoes));
      initGrid();
      mostrar('Reservados ' + cartoes.length + ' cartões, de A=' + dados.de + ' a A=' + dados.ate
        + ' (lote ' + dados.lote + '). Agora guarde como PDF.', 'ok');
    } catch (e) {
      mostrar('Não reservou: ' + e.message, 'erro');
    } finally {
      reservarBtn.disabled = false;
    }
  }

  topMarginInput.addEventListener('input', applyAll);
  bottomMarginInput.addEventListener('input', applyAll);
  rowsInput.addEventListener('input', applyAll);
  colsInput.addEventListener('input', applyAll);
  quantosInput.addEventListener('input', saveSettings);
  donoInput.addEventListener('change', saveSettings);
  reservarBtn.addEventListener('click', reservar);

  resetBtn.addEventListener('click', function () {
    topMarginInput.value = DEFAULTS.topMargin;
    bottomMarginInput.value = DEFAULTS.bottomMargin;
    rowsInput.value = DEFAULTS.rows;
    colsInput.value = DEFAULTS.cols;
    quantosInput.value = DEFAULTS.quantos;
    applyAll();
  });

  loadSettings();
  try { cartoes = JSON.parse(localStorage.getItem(CARTOES_KEY)) || []; } catch (e) { cartoes = []; }
  if (cartoes.length) {
    mostrar('Está a mostrar o último lote reservado, de A=' + cartoes[0].afiliado + ' a A='
      + cartoes[cartoes.length - 1].afiliado + '. Reserve outro para números novos.', '');
  }
  applyAll();
  carregarDonos();

  // Sem isto, a primeira folha e medida com a letra de recurso do sistema e as duas linhas saem
  // com larguras diferentes. Viu-se na imagem da etiqueta.
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(function () { initGrid(); });
  }
})();
</script>
</body>
</html>
