<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>McMinsky · Ao Vivo</title>
  <link rel="icon" type="image/png" href="https://i.postimg.cc/T27BCpJj/logo-without-text.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --black:  #0a0a0a;
      --gold:   #c9a962;
      --gold-d: #a88a4a;
      --white:  #f0ece4;
      --dim:    #888;
      --font-d: 'Cormorant Garamond', serif;
      --font-b: 'Inter', sans-serif;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      background: var(--black);
      color: var(--white);
      font-family: var(--font-b);
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.25rem;
      padding: 1rem;
      min-height: 100dvh;
    }

    /* ── HEADER ── */
    .header {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      width: 100%;
      max-width: 1100px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-family: var(--font-d);
      font-size: 1.15rem;
      font-weight: 600;
      color: var(--gold);
      letter-spacing: 0.02em;
      text-decoration: none;
    }

    .logo img {
      width: 24px;
      height: 24px;
      object-fit: contain;
    }

    .live-badge {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.65rem;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--white);
      background: #c0392b;
      padding: 0.3rem 0.7rem;
      border-radius: 4px;
    }

    .live-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #fff;
      animation: blink 1.6s ease-in-out infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.3; }
    }

    /* ── PLAYER WRAPPER ── */
    .player-wrap {
      position: relative;
      width: 100%;
      max-width: 1100px;
      aspect-ratio: 16 / 9;
      background: #111;
      border-radius: 6px;
      overflow: hidden;
      box-shadow: 0 0 0 1px rgba(201,169,98,0.12), 0 20px 60px rgba(0,0,0,0.7);
    }

    .player-wrap iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* ── SHIELDS: bloqueiam cliques para o site Twitch ── */
    /* Shield topo: cobre título/canal */
    .shield-top {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 62px;
      z-index: 10;
      cursor: default;
    }

    /* Shield canto inferior direito: cobre "Watch on Twitch" */
    .shield-br {
      position: absolute;
      bottom: 0;
      right: 0;
      width: 160px;
      height: 56px;
      z-index: 10;
      cursor: default;
    }

    /* ── BOTÃO FULLSCREEN CUSTOM ── */
    .fs-btn {
      position: absolute;
      bottom: 10px;
      left: 10px;
      z-index: 20;
      background: rgba(0,0,0,0.55);
      border: 1px solid rgba(201,169,98,0.3);
      border-radius: 4px;
      padding: 0.35rem 0.6rem;
      cursor: pointer;
      color: var(--gold);
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-family: var(--font-b);
      transition: background 0.2s, border-color 0.2s;
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }

    .fs-btn:hover {
      background: rgba(201,169,98,0.12);
      border-color: rgba(201,169,98,0.6);
    }

    .fs-btn svg {
      width: 13px;
      height: 13px;
      fill: currentColor;
    }

    /* ── FOOTER ── */
    .footer {
      font-size: 0.7rem;
      color: var(--dim);
      letter-spacing: 0.05em;
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 480px) {
      body { gap: 0.75rem; padding: 0.6rem; }
      .logo { font-size: 1rem; }
      .shield-top { height: 52px; }
      .shield-br  { width: 130px; height: 48px; }
    }
  </style>
</head>
<body>

  <header class="header">
    <a href="/" class="logo">
      <img src="https://i.postimg.cc/T27BCpJj/logo-without-text.png" alt="McMinsky">
      McMinsky
    </a>
    <div class="live-badge">
      <span class="live-dot"></span>
      Ao vivo
    </div>
  </header>

  <div class="player-wrap" id="playerWrap">

    <iframe
      id="twitchPlayer"
      src="https://player.twitch.tv/?channel=mcminsky2026&parent=mcminsky.pt&parent=www.mcminsky.pt&autoplay=true&muted=false"
      allowfullscreen
      allow="autoplay; fullscreen">
    </iframe>

    <!-- Shields de privacidade -->
    <div class="shield-top"  aria-hidden="true"></div>
    <div class="shield-br"   aria-hidden="true"></div>

    <!-- Botão fullscreen -->
    <button class="fs-btn" id="fsBtn" title="Ecrã inteiro" aria-label="Ecrã inteiro">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M3 3h6v2H5v4H3V3zm12 0h6v6h-2V5h-4V3zM3 15h2v4h4v2H3v-6zm16 4h-4v2h6v-6h-2v4z"/>
      </svg>
      Ecrã inteiro
    </button>

  </div>

  <footer class="footer">mcminsky.pt &nbsp;·&nbsp; Sessão privada</footer>

  <script>
    const wrap  = document.getElementById('playerWrap');
    const fsBtn = document.getElementById('fsBtn');

    fsBtn.addEventListener('click', function () {
      const el = wrap;
      if (el.requestFullscreen)            el.requestFullscreen();
      else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
      else if (el.mozRequestFullScreen)    el.mozRequestFullScreen();
      else if (el.msRequestFullscreen)     el.msRequestFullscreen();
    });

    /* Actualizar ícone quando sair do fullscreen */
    document.addEventListener('fullscreenchange', updateFsIcon);
    document.addEventListener('webkitfullscreenchange', updateFsIcon);

    function updateFsIcon() {
      const isFs = !!document.fullscreenElement;
      fsBtn.innerHTML = isFs
        ? '<svg viewBox="0 0 24 24"><path d="M5 9H3V3h6v2H5v4zm11-4h-4V3h6v6h-2V5zM5 15v4h4v2H3v-6h2zm14 4h-4v2h6v-6h-2v4z"/></svg> Sair'
        : '<svg viewBox="0 0 24 24"><path d="M3 3h6v2H5v4H3V3zm12 0h6v6h-2V5h-4V3zM3 15h2v4h4v2H3v-6zm16 4h-4v2h6v-6h-2v4z"/></svg> Ecrã inteiro';
    }
  </script>

</body>
</html>
