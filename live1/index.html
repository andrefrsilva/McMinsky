<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>McMinsky · Ao Vivo</title>
  <link rel="icon" type="image/png" href="https://i.postimg.cc/T27BCpJj/logo-without-text.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --black:  #0a0a0a;
      --gold:   #c9a962;
      --white:  #f0ece4;
      --dim:    #666;
      --font-d: 'Cormorant Garamond', serif;
      --font-b: 'Inter', sans-serif;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      background: var(--black);
      color: var(--white);
      font-family: var(--font-b);
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      padding: 1rem;
      min-height: 100dvh;
    }

    /* ── HEADER ── */
    .header {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      width: 100%;
      max-width: 1100px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-family: var(--font-d);
      font-size: 1.15rem;
      font-weight: 600;
      color: var(--gold);
      letter-spacing: 0.02em;
      text-decoration: none;
    }

    .logo img { width: 24px; height: 24px; object-fit: contain; }

    .live-badge {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.65rem;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #fff;
      background: #c0392b;
      padding: 0.3rem 0.7rem;
      border-radius: 4px;
    }

    .live-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #fff;
      animation: blink 1.6s ease-in-out infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.3; }
    }

    /* ── PLAYER WRAPPER ── */
    .player-wrap {
      position: relative;
      width: 100%;
      max-width: 1100px;
      aspect-ratio: 16 / 9;
      background: #111;
      border-radius: 6px;
      overflow: hidden;
      box-shadow: 0 0 0 1px rgba(201,169,98,0.12), 0 20px 60px rgba(0,0,0,0.7);
    }

    /* O embed Twitch JS cria um iframe — forçar a ocupar tudo */
    .player-wrap iframe,
    .player-wrap #twitch-embed,
    #twitch-embed {
      position: absolute !important;
      inset: 0 !important;
      width: 100% !important;
      height: 100% !important;
      border: none !important;
    }

    /* ── SHIELDS ── */
    .shield-top {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 62px;
      z-index: 10;
      cursor: default;
      pointer-events: auto;
      background: transparent;
    }

    .shield-br {
      position: absolute;
      bottom: 0; right: 0;
      width: 170px; height: 58px;
      z-index: 10;
      cursor: default;
      pointer-events: auto;
      background: transparent;
    }

    /* ── BOTÕES OVERLAY ── */
    .overlay-btns {
      position: absolute;
      bottom: 12px;
      left: 12px;
      z-index: 20;
      display: flex;
      gap: 0.5rem;
    }

    .ovr-btn {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      background: rgba(0,0,0,0.6);
      border: 1px solid rgba(201,169,98,0.4);
      border-radius: 4px;
      padding: 0.32rem 0.65rem;
      cursor: pointer;
      color: var(--gold);
      font-size: 0.68rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-family: var(--font-b);
      transition: background 0.2s, border-color 0.2s;
    }

    .ovr-btn:hover {
      background: rgba(201,169,98,0.15);
      border-color: rgba(201,169,98,0.7);
    }

    .ovr-btn svg { width: 13px; height: 13px; fill: currentColor; }

    /* ── FOOTER ── */
    .footer {
      font-size: 0.7rem;
      color: var(--dim);
      letter-spacing: 0.05em;
    }

    /* ── MOBILE ── */
    @media (max-width: 480px) {
      body { gap: 0.6rem; padding: 0.6rem; }
      .logo { font-size: 1rem; }
    }
  </style>
</head>
<body>

  <header class="header">
    <a href="/" class="logo">
      <img src="https://i.postimg.cc/T27BCpJj/logo-without-text.png" alt="McMinsky">
      McMinsky
    </a>
    <div class="live-badge">
      <span class="live-dot"></span>
      Ao vivo
    </div>
  </header>

  <div class="player-wrap" id="playerWrap">

    <!-- Twitch JS Embed monta o iframe aqui -->
    <div id="twitch-embed"></div>

    <!-- Shields de privacidade: bloqueiam cliques no título e "Watch on Twitch" -->
    <div class="shield-top" aria-hidden="true"></div>
    <div class="shield-br"  aria-hidden="true"></div>

    <!-- Botões custom -->
    <div class="overlay-btns">
      <button class="ovr-btn" id="soundBtn">
        <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
        Activar som
      </button>
      <button class="ovr-btn" id="fsBtn">
        <svg viewBox="0 0 24 24"><path d="M3 3h6v2H5v4H3V3zm12 0h6v6h-2V5h-4V3zM3 15h2v4h4v2H3v-6zm16 4h-4v2h6v-6h-2v4z"/></svg>
        Ecrã inteiro
      </button>
    </div>

  </div>

  <footer class="footer">mcminsky.pt &nbsp;·&nbsp; Sessão privada</footer>

  <!-- API oficial Twitch Embed JS -->
  <script src="https://embed.twitch.tv/embed/v1.js"></script>

  <script>
    var player;
    var muted = true;

    var embed = new Twitch.Embed("twitch-embed", {
      width:   "100%",
      height:  "100%",
      channel: "mcminsky2026",
      layout:  "video",        /* apenas vídeo, sem chat */
      autoplay: true,
      muted:    true,
      parent:  ["mcminsky.pt", "www.mcminsky.pt"]
    });

    embed.addEventListener(Twitch.Embed.VIDEO_READY, function () {
      player = embed.getPlayer();
      player.setMuted(true);
      player.play();
    });

    /* Som */
    document.getElementById('soundBtn').addEventListener('click', function () {
      if (!player) return;
      muted = !muted;
      player.setMuted(muted);
      this.innerHTML = muted
        ? '<svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg> Activar som'
        : '<svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM18.5 12c0-2.77-1.6-5.15-3.9-6.32v2.22c1.46 1 2.4 2.67 2.4 4.1s-.94 3.1-2.4 4.1v2.22C16.9 17.15 18.5 14.77 18.5 12z"/></svg> Som ligado';
    });

    /* Fullscreen */
    var wrap = document.getElementById('playerWrap');
    document.getElementById('fsBtn').addEventListener('click', function () {
      if (wrap.requestFullscreen)            wrap.requestFullscreen();
      else if (wrap.webkitRequestFullscreen) wrap.webkitRequestFullscreen();
      else if (wrap.mozRequestFullScreen)    wrap.mozRequestFullScreen();
    });

    document.addEventListener('fullscreenchange', function () {
      var isFs = !!document.fullscreenElement;
      var btn = document.getElementById('fsBtn');
      btn.innerHTML = isFs
        ? '<svg viewBox="0 0 24 24"><path d="M5 9H3V3h6v2H5v4zm11-4h-4V3h6v6h-2V5zM5 15v4h4v2H3v-6h2zm14 4h-4v2h6v-6h-2v4z"/></svg> Sair'
        : '<svg viewBox="0 0 24 24"><path d="M3 3h6v2H5v4H3V3zm12 0h6v6h-2V5h-4V3zM3 15h2v4h4v2H3v-6zm16 4h-4v2h6v-6h-2v4z"/></svg> Ecrã inteiro';
    });
  </script>

</body>
</html>
